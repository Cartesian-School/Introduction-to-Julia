# Course environment for "Introduction to Julia".
#
# This is an *application* project (a pinned teaching environment), not a
# library, so it deliberately carries no `name`/`uuid`/`version` keys:
#   * Julia package names must be valid identifiers, so the repository name
#     "Introduction-to-Julia" cannot be used verbatim; and
#   * declaring a name/uuid makes Pkg treat this directory as a package and
#     look for `src/<Name>.jl` during precompilation, which would break the
#     `Pkg.instantiate()` step documented in README.md.
# Manifest.toml is committed alongside this file so the environment resolves
# identically for every student.

[deps]
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
GR = "28b8d3ca-fb5f-59d9-8090-bfdbd6d07a71"
JordanForm = "3e0f3a26-b485-4542-9924-3b1a11022d22"
LinearAlgebraX = "9b3f67b0-2d00-526e-9884-9e4938f8fb88"
PlotlyJS = "f0f68f2c-4968-5e81-91da-67840de0976a"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
SymbolicUtils = "d1185830-fcd6-423d-90d6-eec64667417b"
Symbolics = "0c5d862f-8b57-4792-8d23-62f2024744c7"

# Bounds below match the versions actually resolved in Manifest.toml
# (julia_version 1.11.3), so `Pkg.resolve()` keeps the current dependency set.
[compat]
BenchmarkTools = "1.6"
GR = "0.73"
JordanForm = "0.1"
LinearAlgebraX = "0.2"
PlotlyJS = "0.18"
Plots = "1.40"
SymbolicUtils = "1.7"
Symbolics = "5.28"
julia = "1.11"
