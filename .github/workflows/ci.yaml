# ---------------------------------------------------------------------------
# Course CI pipeline
# ---------------------------------------------------------------------------
# Written in GitHub Actions syntax and located where GitHub auto-discovers it.
# The steps are plain shell, so the `jobs:` blocks port easily to another
# runner (GitLab CI, Woodpecker, Forgejo Actions) if needed.
# ---------------------------------------------------------------------------

name: Course CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 1. Linting -- markdownlint over every Markdown file in the repository.
  # -------------------------------------------------------------------------
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install --global markdownlint-cli@0.41.0

      - name: Run markdownlint on all .md files
        # LICENSE-CC-BY-NC-SA.md is verbatim upstream legal text and must not
        # be reformatted, so it is excluded from style enforcement.
        run: |
          markdownlint \
            --ignore node_modules \
            --ignore LICENSE-CC-BY-NC-SA.md \
            --config .markdownlint.json \
            "**/*.md"

  # -------------------------------------------------------------------------
  # 2. Link checking -- verify links in the two generated documents.
  # -------------------------------------------------------------------------
  link-check:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdown-link-check
        run: npm install --global markdown-link-check@3.12.2

      - name: Check README.md and AUDIT_REPORT.md
        run: |
          set -e
          for doc in README.md AUDIT_REPORT.md; do
            echo "::group::Checking $doc"
            markdown-link-check --quiet --retry "$doc"
            echo "::endgroup::"
          done

  # -------------------------------------------------------------------------
  # 3. Course integrity -- the invariants that matter for a teaching repo.
  # -------------------------------------------------------------------------
  course-checks:
    name: Course integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test the validator
        # A validator that always reports PASS is worthless. This builds
        # deliberately corrupted fixtures and asserts each one is rejected.
        run: python3 tools/test_check_course.py

      - name: Validate course invariants
        # Notebook JSON, kernel consistency, monotonic execution order,
        # unexpected error outputs, leaked local paths and secrets,
        # objectives/navigation, and the exercise/solution contract.
        run: python3 tools/check_course.py

  # -------------------------------------------------------------------------
  # 4. Build test -- placeholder for the course build/export step.
  # -------------------------------------------------------------------------
  build:
    name: Build course
    runs-on: ubuntu-latest
    needs: [lint, link-check, course-checks]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        run: echo "Building course..."
