# GitHub Actions workflow for the Cartesian School "Julia from Zero" repository.
# This workflow is intentionally conservative and stable:
# 1. It validates the repository structure.
# 2. It checks that the canonical Polish notebooks exist in PL/.
# 3. It validates that all required notebooks are valid Jupyter notebook JSON files.
# 4. It restores the Julia project environment and precompiles dependencies.
# 5. If optional repository validation tools exist, it runs them.
#
# The design goal is to keep CI green and trustworthy after the repository rename
# and after the course restructuring to Lesson 0 ... Lesson 14 in the PL/ directory.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-structure:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install notebook validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat

      - name: Validate canonical repository files and notebook inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import sys

          repo_root = Path(".")
          pl_dir = repo_root / "PL"

          required_root_files = [
              "Project.toml",
              "README.md",
              "README.pl.md",
              "README.ru.md",
          ]

          canonical_polish_notebooks = [
              "PL/Lesson_0_Julia_Cartesian_School_PL.ipynb",
              "PL/Lesson_1_Strings_Julia_Cartesian_School_PL.ipynb",
              "PL/Lesson_2_Data_Structures_Julia_Cartesian_School_PL.ipynb",
              "PL/Lesson_3_Loops_Julia_Cartesian_School_PL.ipynb",
              "PL/Lesson_4_Conditionals_Julia_Cartesian_School_PL.ipynb",
              "PL/Lesson_5_Functions_Julia_Cartesian_School_PL.ipynb",
              "PL/Lesson_6_Packages_Julia_Cartesian_School_PL.ipynb",
              "PL/Lesson_7_Plotting_Julia_Cartesian_School_PL.ipynb",
              "PL/Lesson_8_Multiple_Dispatch_Julia_Cartesian_School_PL.ipynb",
              "PL/Lesson_9_Julia_is_Fast_Cartesian_School_PL.ipynb",
              "PL/Lesson_10_Linear_Algebra_Concepts_Julia_Cartesian_School_PL.ipynb",
              "PL/Lesson_11_Linear_Algebra_in_Julia_Cartesian_School_PL.ipynb",
              "PL/Lesson_12_Factorizations_and_Other_Fun_Julia_Cartesian_School_PL.ipynb",
              "PL/Lesson_13_Numerical_Computing_Julia_Cartesian_School_PL.ipynb",
              "PL/Lesson_14_Final_Project_Capstone_Julia_Cartesian_PL.ipynb",
          ]

          missing = []

          for file_name in required_root_files:
              path = repo_root / file_name
              if not path.exists():
                  missing.append(str(path))

          if not pl_dir.exists() or not pl_dir.is_dir():
              missing.append("PL/ directory")

          for notebook_path in canonical_polish_notebooks:
              path = repo_root / notebook_path
              if not path.exists():
                  missing.append(str(path))

          if missing:
              print("ERROR: Missing required repository files:")
              for item in missing:
                  print(f" - {item}")
              sys.exit(1)

          if len(canonical_polish_notebooks) != 15:
              print("ERROR: CI inventory must contain exactly 15 canonical lessons.")
              sys.exit(1)

          print("Canonical notebook inventory:")
          for path in canonical_polish_notebooks:
              print(f" - {path}")

          # Validate notebook JSON structure.
          for notebook_path in canonical_polish_notebooks:
              path = repo_root / notebook_path
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"ERROR: Cannot parse notebook JSON: {notebook_path}: {exc}")
                  sys.exit(1)

              if not isinstance(data, dict):
                  print(f"ERROR: Notebook root must be an object: {notebook_path}")
                  sys.exit(1)

              if data.get("nbformat") != 4:
                  print(f"ERROR: Unexpected nbformat in {notebook_path}: {data.get('nbformat')}")
                  sys.exit(1)

              cells = data.get("cells")
              if not isinstance(cells, list) or len(cells) == 0:
                  print(f"ERROR: Notebook has no cells: {notebook_path}")
                  sys.exit(1)

          print("Repository structure validation: PASS")
          PY

  julia-environment:
    name: Restore Julia environment
    runs-on: ubuntu-latest
    needs:
      - repository-structure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia 1.11
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Cache Julia artifacts and packages
        uses: julia-actions/cache@v2

      - name: Instantiate project
        shell: bash
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Precompile project
        shell: bash
        run: |
          julia --project=. -e 'using Pkg; Pkg.precompile()'

      - name: Julia environment smoke test
        shell: bash
        run: |
          julia --project=. -e '
          using Pkg
          println("Active project: ", Base.active_project())
          deps = Pkg.dependencies()
          println("Dependency entries loaded: ", length(deps))
          println("Julia environment smoke test: PASS")
          '

  optional-repository-tools:
    name: Run optional repository tools
    runs-on: ubuntu-latest
    needs:
      - repository-structure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run repository validators if present
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f tools/check_course.py ]]; then
            echo "Running tools/check_course.py"
            python3 tools/check_course.py
          else
            echo "tools/check_course.py not found - skipping."
          fi

          if [[ -f tools/test_check_course.py ]]; then
            echo "Running tools/test_check_course.py"
            python3 tools/test_check_course.py
          else
            echo "tools/test_check_course.py not found - skipping."
          fi
