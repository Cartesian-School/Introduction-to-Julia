# ---------------------------------------------------------------------------
# Course CI pipeline
# ---------------------------------------------------------------------------
# GitHub Actions workflow for the Introduction to Julia course.
# Validates Markdown, links, notebook/course integrity, and repository health.
# ---------------------------------------------------------------------------

name: Course CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 1. Markdown linting
  # -------------------------------------------------------------------------
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install markdownlint-cli
        run: npm install --global markdownlint-cli@0.41.0

      - name: Run markdownlint on Markdown files
        # LICENSE-CC-BY-NC-SA.md contains verbatim legal text and is excluded
        # from style enforcement.
        run: |
          markdownlint \
            --ignore node_modules \
            --ignore LICENSE-CC-BY-NC-SA.md \
            --config .markdownlint.json \
            "**/*.md"

  # -------------------------------------------------------------------------
  # 2. Link checking for multilingual README files
  # -------------------------------------------------------------------------
  link-check:
    name: Check links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install markdown-link-check
        run: npm install --global markdown-link-check@3.12.2

      - name: Check README links
        run: |
          set -euo pipefail

          for doc in README.md README.ru.md README.pl.md; do
            echo "::group::Checking $doc"

            markdown-link-check \
              --quiet \
              --retry \
              --config .markdown-link-check.json \
              "$doc"

            echo "::endgroup::"
          done

  # -------------------------------------------------------------------------
  # 3. Course integrity
  # -------------------------------------------------------------------------
  course-checks:
    name: Course integrity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test the validator
        # Ensures the validator rejects deliberately corrupted fixtures.
        run: python3 tools/test_check_course.py

      - name: Validate course invariants
        # Checks notebook JSON, Julia kernel metadata, execution order,
        # unexpected errors, local paths, secrets, navigation, and exercises.
        run: python3 tools/check_course.py

  # -------------------------------------------------------------------------
  # 4. Build smoke test
  # -------------------------------------------------------------------------
  build:
    name: Build course
    runs-on: ubuntu-latest
    needs: [lint, link-check, course-checks]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        run: echo "Building course..."
