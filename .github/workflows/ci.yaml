name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install notebook validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat

      - name: Validate bilingual course repository
        run: python3 tools/check_course.py --strict

  python-validator-tests:
    name: Python validator tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install notebook validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat

      - name: Run validator fixture tests
        run: python3 tools/test_check_course.py

  markdown-quality:
    name: Markdown quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.18.1 README.md README.pl.md README.ru.md

      - name: Check README links
        run: |
          npx --yes markdown-link-check@3.13.7 --config .markdown-link-check.json README.md
          npx --yes markdown-link-check@3.13.7 --config .markdown-link-check.json README.pl.md
          npx --yes markdown-link-check@3.13.7 --config .markdown-link-check.json README.ru.md

  julia-environment:
    name: Julia environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia 1.11
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Cache Julia artifacts and packages
        uses: julia-actions/cache@v2

      - name: Instantiate project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Precompile project
        run: julia --project=. -e 'using Pkg; Pkg.precompile()'

      - name: Smoke import declared packages
        run: |
          julia --project=. -e '
            using BenchmarkTools
            using GR
            using JordanForm
            using LinearAlgebraX
            using PlotlyJS
            using Plots
            using SymbolicUtils
            using Symbolics
            using Pkg
            Pkg.status()
            println("Julia environment smoke test: PASS")
          '

  notebook-code-sanity:
    name: Notebook code syntax sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Julia 1.11
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Check notebook code cell syntax only
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python3 - "$tmpdir" <<'PY'
          import json
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          for notebook in sorted(Path("PL").glob("Lesson_*.ipynb")) + sorted(Path("RU").glob("Lesson_*.ipynb")):
              data = json.loads(notebook.read_text(encoding="utf-8"))
              code = []
              for index, cell in enumerate(data.get("cells", [])):
                  if cell.get("cell_type") != "code":
                      continue
                  source = cell.get("source", "")
                  text = "".join(source) if isinstance(source, list) else str(source)
                  code.append(f"# {notebook} cell {index}\nbegin\n{text}\nend\n")
              target = out / f"{notebook.parent.name}_{notebook.stem}.jl"
              target.write_text("\n".join(code), encoding="utf-8")
          PY
          julia --startup-file=no -e '
            function main(files)
              ok = true
              for file in files
                try
                  Meta.parseall(read(file, String))
                catch err
                  ok = false
                  println("Syntax check failed for ", file)
                  showerror(stdout, err)
                  println()
                end
              end
              ok || exit(1)
              println("Notebook code syntax sanity: PASS")
            end
            main(ARGS)
          ' "$tmpdir"/*.jl
